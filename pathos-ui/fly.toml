# fly.toml app configuration file generated for theory-app on 2026-09-28T03:31:47-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'theory-app'
primary_region = 'dfw'

[build]
  [build_args]
    NEXT_PUBLIC_THEORY_API_URL = "https://theory-api.fly.dev"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[env]
  HOSTNAME = "0.0.0.0"
  PORT = "3000"